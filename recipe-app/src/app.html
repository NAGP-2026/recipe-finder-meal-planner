<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="RecipeHub — Discover, save & plan amazing recipes from around the world" />
		<meta name="theme-color" content="#080B14" />
		<title>RecipeHub — Discover & Plan Amazing Meals</title>

		<!-- DNS + connection pre-warming for critical third-party origins -->
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link rel="preconnect" href="https://www.themealdb.com" crossorigin />
		<link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
		<link rel="dns-prefetch" href="https://www.themealdb.com" />
		<link rel="dns-prefetch" href="https://www.themealthumb.com" />

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

		<!-- StencilJS component library via jsDelivr CDN
		     Loading from CDN means all lazy-loaded chunk files (p-*.entry.js) are
		     served from the same CDN origin — Stencil's runtime resolves them correctly
		     in both development and production (Vercel) environments. -->
		<script type="module"
			src="https://cdn.jsdelivr.net/npm/@piyushchandel/recipe-components@1.0.6/dist/recipe-components/recipe-components.esm.js"
			integrity="sha384-8iiXo4a8V14vO/J5nCS/g4B8E3K+3EtiC40M2dMQ+g0PqaJ51yk9xYTrlMWRaYRA"
			crossorigin="anonymous"></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<div style="position:fixed;inset:0;background:#080B14;color:#B8C0E0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:sans-serif;text-align:center;padding:24px;z-index:9999;">
				<div style="font-size:52px;">🍽️</div>
				<h1 style="color:#fff;font-size:22px;margin:0;">RecipeHub requires JavaScript</h1>
				<p style="max-width:380px;line-height:1.6;margin:0;">Please enable JavaScript in your browser to use RecipeHub — recipe discovery, meal planning, and favorites all depend on it.</p>
			</div>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
